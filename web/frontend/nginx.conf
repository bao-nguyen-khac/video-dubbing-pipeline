# Proxy /api/* sang service web-api (tên service trong docker-compose network)
# để cookie session (SESSION_COOKIE_NAME, xem web/backend/auth.py) và mọi gọi
# API vẫn same-origin từ góc nhìn trình duyệt — không cần CORS.
server {
    listen 80;

    location /api/ {
        proxy_pass http://web-api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # tắt buffering để stream video output (GET /api/jobs/{id}/output) thẳng
        # cho client thay vì nginx phải tải hết vào bộ nhớ trước
        proxy_buffering off;
        # Mặc định nginx timeout 60s ngắn hơn thời gian xử lý thật của
        # POST /api/voices/preview (LucyAI poll tới 120s, 9router TTS đôi khi
        # chậm) — nâng lên 150s để không cắt request giữa chừng (504, bug
        # thật phát hiện lúc verify router-tts, 004-voice-selection-preview)
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
